[build]
  # 构建命令
  command = "npm run build"
  # 发布目录
  publish = "dist"

[build.environment]
  # Node.js 版本
  NODE_VERSION = "18"

# SPA 路由重定向规则
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API 代理配置（如果需要）
# 注意：Netlify Functions 或外部 API 需要单独配置
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api-url/api/:splat"
#   status = 200
#   force = true

# 静态资源缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
