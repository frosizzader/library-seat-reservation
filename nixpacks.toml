# Railway Nixpacks 构建配置
# 强制使用 Node.js provider，忽略前端 Vite 自动检测

[variables]
  NIXPACKS_NODE_VERSION = "18"
  npm_config_production = "false"

# Provider: 强制 Node.js
[phases.setup]
nixPkgs = ["nodejs_18"]

# 安装依赖：前后端都装
[phases.install]
cmds = ["cd /workspace/frontend && npm install", "cd /workspace/backend && npm install --omit=dev"]

# 构建：构建前端，复制到 backend/public/
[phases.build]
cmds = ["cd /workspace/frontend && npm run build", "mkdir -p /workspace/backend/public && cp -r /workspace/frontend/dist/* /workspace/backend/public/"]

# 启动后端
[start]
cmd = "cd /workspace/backend && node src/app.js"
